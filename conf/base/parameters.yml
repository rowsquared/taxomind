embedding:
  model_name: "BAAI/bge-m3"

zero_shot:
  sample_text: "Job_description: vegetable farmer"
  model_name: "BAAI/bge-m3"
  topdown_k: 1
  bottomup_k: 1
  flat_k: 1
  hybrid_k: 1
  debug_level: "low"  # Options: "low", "medium", "high"
  # Improvement configurations
  parent_weight: 0.3  # Weight for parent context in bottom-up (0.0-1.0)
  min_confidence: 0.4  # Minimum confidence threshold for predictions

supervised:
  languages: ["multi"]
  base_model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"

judge:
  model_name: "llama3.1:8b"
  enabled: false  # Set to false to disable judge and use consensus/highest-score fallback
