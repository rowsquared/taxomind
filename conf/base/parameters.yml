taxonomy_key: "ISCO"  # Default taxonomy to use

model_name: "BAAI/bge-m3"

zero_shot:
  topdown_k: 1
  bottomup_k: 1
  flat_k: 1
  hybrid_k: 1
  debug_level: "low"  # Options: "low", "medium", "high"
  # Improvement configurations
  parent_weight: 0.3  # Weight for parent context in bottom-up (0.0-1.0)
  min_confidence: 0.4  # Minimum confidence threshold for predictions

  # Top-Down with Confidence Gating parameters (adaptive approach)
  min_confidence_level1: 0.05  # Minimum confidence to accept at level 1 (ensures we match something)
  stop_on_decrease: true  # Stop when confidence decreases from previous level (adaptive stopping)

  # Bottom-Up Path Aggregation parameters
  aggregation_method: "mean_top_k"  # Options: "max", "mean", "mean_top_k"
  top_k_children: 3  # Number of top children to consider for mean_top_k aggregation

  # Disagreement Detection parameters
  disagreement_threshold: 3  # Minimum number of different parents to consider as disagreement



