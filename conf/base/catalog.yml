# Kedro Data Catalog (multilingual-aware). All datasets may contain UTF-8 text in
# any language, so downstream nodes should avoid locale assumptions.


classifai_validation_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/taxonomies/validation_data/export-2026-01-12T16_07_07.162Z.csv
  load_args:
    encoding: utf-8
    dtype:
      ISCO_1: str
      ISCO_2: str
      ISCO_3: str
      ISCO_4: str
      ISIC_1: str
      ISIC_2: str
      ISIC_3: str
      ISIC_4: str

isco_taxonomy_definition:
  type: pandas.ExcelDataset
  filepath: data/01_raw/taxonomies/ISCO-08 EN Structure and definitions.xlsx
  load_args:
    dtype:
      ISCO 08 Code: str
  save_args:
    sheet_name: ISCO-08 EN Struct and defin


isic_taxonomy_definition:
  type: pandas.CSVDataset
  filepath: data/01_raw/taxonomies/ISICRev4 NT input.csv
  load_args:
    encoding: utf-8
    dtype:
      Code: str


training_data_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/training_data.csv
  load_args:
    encoding: utf-8
    dtype:
      isco_level4: str
      isic_level4: str

taxonomy_definition:
  type: partitions.PartitionedDataset
  path: data/03_primary/taxonomies
  dataset:
    type: pandas.CSVDataset
    load_args:
      dtype:
        code: str
        parentCode: str
        definition: str
        examples: str
    save_args:
      encoding: utf-8
      index: false
      quoting: 1      # csv.QUOTE_ALL
      quotechar: '"' 
  filename_suffix: .csv

taxonomy_definition_for_testing:
  type: partitions.PartitionedDataset
  path: data/03_primary/taxonomies/testing
  dataset:
    type: pandas.CSVDataset
    load_args:
      dtype:
        code: str
        parent_id: str
        definition: str
        examples: str
    save_args:
      encoding: utf-8
      index: false
      quoting: 1      # csv.QUOTE_ALL
      quotechar: '"' 
  filename_suffix: .csv


taxonomy_definition_llm:
  type: partitions.PartitionedDataset
  path: data/03_primary/taxonomies/llm_enriched
  dataset:
    type: pandas.CSVDataset
    load_args:
      dtype:
        code: str
        parentCode: str
        definition: str
        examples: str
    save_args:
      encoding: utf-8
      index: false
      quoting: 1      # csv.QUOTE_ALL
      quotechar: '"' 
  filename_suffix: .csv

taxonomy_request:
  type: MemoryDataset

taxonomy_request_files:
  type: partitions.PartitionedDataset
  path: data/03_primary/taxonomies/requests
  dataset: json.JSONDataset
  filename_suffix: .json


taxonomy_training:
