# Kedro Data Catalog (multilingual-aware). All datasets may contain UTF-8 text in
# any language, so downstream nodes should avoid locale assumptions.


isco_taxonomy_definition:
  type: pandas.ExcelDataset
  filepath: data/01_raw/taxonomies/ISCO-08 EN Structure and definitions.xlsx
  load_args:
    dtype:
      ISCO 08 Code: str
  save_args:
    sheet_name: ISCO-08 EN Struct and defin


isic_taxonomy_definition:
  type: pandas.CSVDataset
  filepath: data/01_raw/taxonomies/ISICRev4 NT input.csv
  load_args:
    encoding: utf-8
    dtype:
      Code: str


training_data_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/training_data.csv
  load_args:
    encoding: utf-8
    dtype:
      isco_level4: str
      isic_level4: str

taxonomy_definition:
  type: partitions.PartitionedDataset
  path: data/03_primary/taxonomies
  dataset:
    type: pandas.CSVDataset
    load_args:
      dtype:
        code: str
        parentCode: str
  filename_suffix: .csv


taxonomy_request:
  type: partitions.PartitionedDataset
  path: data/03_primary/taxonomies/requests
  dataset: json.JSONDataset
  filename_suffix: .json


taxonomy_training:
  type: partitions.PartitionedDataset
  path: data/03_primary/training/taxonomies
  dataset: pandas.CSVDataset
  filename_suffix: .csv


training_sentences:
  type: partitions.PartitionedDataset
  path: data/03_primary/training
  dataset: json.JSONDataset
  filename_suffix: .json

  

taxonomy_table:
  type: MemoryDataset

taxonomy_metadata:
  type: MemoryDataset

taxonomy_validated:
  type: MemoryDataset

taxonomy_enriched:
  type: MemoryDataset

taxonomy_embedded:
  type: partitions.PartitionedDataset
  path: data/03_primary/taxonomies/embedded
  dataset: pandas.ParquetDataset
  filename_suffix: .parquet

taxonomy_full_paths:
  type: MemoryDataset

taxonomy_full_path_embedded:
  type: partitions.PartitionedDataset
  path: data/03_primary/taxonomies/embedded/flat_taxonomies
  dataset: pandas.ParquetDataset
  filename_suffix: .parquet

isco_test_sentences:
  type: json.JSONDataset
  filepath: data/01_raw/isco_test_sentences.json

zero_shot_inputs:
  type: MemoryDataset

zero_shot_sentence_embeddings:
  type: MemoryDataset

zero_shot_topdown:
  type: MemoryDataset

zero_shot_bottomup:
  type: MemoryDataset

zero_shot_flat:
  type: MemoryDataset

zero_shot_hybrid:
  type: MemoryDataset

zero_shot_comparison:
  type: MemoryDataset

zero_shot_judgement:
  type: json.JSONDataset
  filepath: data/07_model_output/zero_shot_judgement.json
  save_args:
    indent: 2

# Training pipeline datasets
labeled_training_csv:
  type: pandas.CSVDataset
  filepath: data/01_raw/labeled_training_data.csv
  load_args:
    encoding: utf-8

prepared_training_data:
  type: MemoryDataset

trained_models:
  type: partitions.PartitionedDataset
  path: data/07_model_output/models
  dataset: pickle.PickleDataset
  filename_suffix: .pkl

training_metrics:
  type: partitions.PartitionedDataset
  path: data/07_model_output/metrics
  dataset:
    type: json.JSONDataset
    save_args:
      indent: 2
  filename_suffix: .json

training_summary:
  type: partitions.PartitionedDataset
  path: data/07_model_output/training_summary
  dataset:
    type: json.JSONDataset
    save_args:
      indent: 2
  filename_suffix: .json

# Learning pipeline datasets (API-based incremental training)
api_training_payload:
  type: partitions.PartitionedDataset
  path: data/08_temp_training/payloads
  dataset:
    type: json.JSONDataset
    save_args:
      indent: 2
      ensure_ascii: false
  filename_suffix: .json

job_config:
  type: partitions.PartitionedDataset
  path: data/08_temp_training/job_configs
  dataset:
    type: json.JSONDataset
    save_args:
      indent: 2
  filename_suffix: .json

validated_payload:
  type: MemoryDataset

converted_training_data:
  type: MemoryDataset

existing_training_data:
  type: partitions.PartitionedDataset
  path: data/06_training
  dataset:
    type: pandas.CSVDataset
    load_args:
      encoding: utf-8
    save_args:
      encoding: utf-8
      index: false
  filename_suffix: _training.csv

persisted_training_data:
  type: partitions.PartitionedDataset
  path: data/06_training
  dataset:
    type: pandas.CSVDataset
    load_args:
      encoding: utf-8
    save_args:
      encoding: utf-8
      index: false
  filename_suffix: _training.csv

loaded_existing_data:
  type: MemoryDataset

appended_training_data:
  type: MemoryDataset

loaded_job_config:
  type: MemoryDataset

taxonomy_df:
  type: MemoryDataset

model_version_metadata:
  type: partitions.PartitionedDataset
  path: data/07_model_output/versions
  dataset:
    type: json.JSONDataset
    save_args:
      indent: 2
  filename_suffix: _version.json

existing_model_version_metadata:
  type: partitions.PartitionedDataset
  path: data/07_model_output/versions
  dataset:
    type: json.JSONDataset
    save_args:
      indent: 2
  filename_suffix: _version.json

updated_version_metadata:
  type: MemoryDataset

# Intermediate in-memory datasets for learning pipeline
trained_models_dict:
  type: MemoryDataset

training_metrics_dict:
  type: MemoryDataset

training_summary_dict:
  type: MemoryDataset

updated_version_metadata_dict:
  type: MemoryDataset

# Inference pipeline datasets
api_inference_payload:
  type: MemoryDataset

inference_config:
  type: MemoryDataset

loaded_inference_config:
  type: MemoryDataset

validated_inference_payload:
  type: MemoryDataset

inference_dataframe:
  type: MemoryDataset

taxonomy_models:
  type: MemoryDataset

inference_predictions:
  type: MemoryDataset

inference_results:
  type: MemoryDataset

# Ensemble pipeline datasets
ensemble_predictions:
  type: MemoryDataset

ensemble_results:
  type: MemoryDataset
