services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      - TASK_BACKEND=dramatiq
      - REDIS_URL=redis://redis:6379/0
      - PORT=3000
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - NUMEXPR_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
      - JOB_STALE_RUNNING_SECONDS=900
    env_file:
      - .env
    ports:
      - "${API_PORT:-3001}:3000"
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; port=os.getenv('PORT','3000'); urllib.request.urlopen(f'http://localhost:{port}/health').read()"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    command: python -m dramatiq taxomind.workers.tasks --processes 1 --threads 1
    environment:
      - TASK_BACKEND=dramatiq
      - REDIS_URL=redis://redis:6379/0
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
      - API_REUSE_PIPELINE_SESSIONS=false
      - JOB_STALE_RUNNING_SECONDS=900
    env_file:
      - .env
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  app_data:
